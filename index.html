<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poké MVP</title>
    <style>
      body { margin: 0; background: #111; color: #fff; font-family: monospace; display: grid; place-items: center; min-height: 100vh; }
      #wrap { display: grid; gap: 8px; }
      canvas { image-rendering: pixelated; border: 2px solid #ddd; width: 960px; max-width: 96vw; aspect-ratio: 3 / 2; }
      .help { color: #bbb; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" width="480" height="320"></canvas>
      <div class="help">Arrows/WASD move • Z/Enter interact • X/Esc back • C/Esc menu • Battle uses arrows + Z</div>
    </div>
    <script type="module" src="./src/mvpGame.js"></script>
  </body>
</html>

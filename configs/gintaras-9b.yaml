# Gintaras 9B — full Lithuanian training run.
# Hardware: 1x 80GB GPU (A100/H100) for the student with QLoRA; teachers served
# separately with vLLM (see README). Expect days, not hours, for the full run.

name: gintaras-9b
output_dir: runs/gintaras-9b
seed: 42

model:
  # Apache-2.0, trained on all EU languages incl. Lithuanian.
  base: utter-project/EuroLLM-9B-Instruct-2512
  load_in_4bit: true
  bf16: true
  max_seq_len: 4096
  attn_implementation: sdpa
  gradient_checkpointing: true
  lora:
    r: 64
    alpha: 128
    dropout: 0.05
    target_modules: all-linear
    train_embeddings: false

data:
  corpus:
    - name: wikimedia/wikipedia
      config: 20231101.lt
      text_field: text
    - name: HuggingFaceFW/fineweb-2
      config: lit_Latn
      text_field: text
      max_docs: 3000000
  instructions:
    - name: neurotechnology/lithuanian-qa-v1
      kind: qa
      eval_fraction: 0.02
    - name: ArturG9/Lithuanian_Context_QA
      kind: context_qa
      eval_fraction: 0.3
    - name: saillab/alpaca-lithuanian-cleaned
      kind: alpaca
      eval_fraction: 0.01
  min_chars: 200
  max_chars: 100000
  min_lt_score: 0.55
  dedup: true

# Teachers: open-weight models whose licenses allow training on their outputs.
# Serve each with an OpenAI-compatible server, e.g.:
#   vllm serve Qwen/Qwen3-235B-A22B-Instruct-2507 --tensor-parallel-size 8 --port 8000
#   vllm serve utter-project/EuroLLM-22B-Instruct-2512 --tensor-parallel-size 2 --port 8001
teachers:
  - name: qwen3-235b
    backend: openai
    base_url: http://localhost:8000/v1
    model: Qwen/Qwen3-235B-A22B-Instruct-2507
    temperature: 0.7
    max_tokens: 3072
    concurrency: 64
  - name: eurollm-22b
    backend: openai
    base_url: http://localhost:8001/v1
    model: utter-project/EuroLLM-22B-Instruct-2512
    temperature: 0.7
    max_tokens: 3072
    concurrency: 64

judge:
  name: judge-qwen3-235b
  backend: openai
  base_url: http://localhost:8000/v1
  model: Qwen/Qwen3-235B-A22B-Instruct-2507
  temperature: 0.0
  max_tokens: 512
  concurrency: 64

synth:
  num_prompts: 60000
  num_contexts: 80000
  min_judge_score: 8.0
  dpo_margin: 2.0
  task_weights:
    context_qa: 0.22
    context_qa_unanswerable: 0.05
    summarize: 0.08
    rewrite: 0.05
    diacritics: 0.04
    grammar_fix: 0.06
    translate_en_lt: 0.06
    essay: 0.12
    open_qa: 0.16
    reasoning: 0.07
    creative: 0.05
    formal_writing: 0.04

cpt:
  enabled: true
  epochs: 1
  learning_rate: 1.0e-4
  batch_size: 4
  grad_accum: 16
  packing: true
  save_steps: 1000

sft:
  epochs: 2
  learning_rate: 2.0e-4
  batch_size: 4
  grad_accum: 8

dpo:
  epochs: 1
  learning_rate: 5.0e-6
  batch_size: 2
  grad_accum: 16
  beta: 0.1

loop:
  rounds: 6
  prompts_per_round: 3000
  student_samples: 2
  target_score: 9.0
  patience: 2
  sft_on_teacher_wins: true

eval:
  max_new_tokens: 1024
  num_judge_prompts: 100
  num_qa: 300
  num_diacritics: 200
  num_ppl_docs: 200
  batch_size: 8

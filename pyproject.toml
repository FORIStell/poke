[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gintaras"
version = "0.1.0"
description = "Gintaras: a Lithuanian-first LLM training pipeline (continued pretraining, distillation, SFT, DPO self-improvement loop, evaluation)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Floors are the versions the pipeline is tested with (TRL/transformers APIs move fast).
dependencies = [
  "torch>=2.5",
  "transformers>=5.18",
  "datasets>=5.0",
  "accelerate>=1.15",
  "peft>=0.21",
  "trl>=1.14",
  "pyyaml>=6.0",
  "openai>=3.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.45"]
dev = ["pytest>=8"]
web = ["matplotlib>=3.8", "playwright>=1.45"]

[project.scripts]
gintaras = "gintaras.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that download a tiny model and train on CPU"]

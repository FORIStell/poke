# Past Lithuanian-language exams from the National Agency for Education (NŠA,
# https://www.nsa.smsm.lt). Each entry pairs a paper with its official marking key.
#   gintaras exams-fetch    -> downloads PDFs + extracts text into data/exams/raw/
#   gintaras exams-convert  -> LLM turns paper+key into data/exams/<level>/<id>.json
# Papers are downloaded locally and are not committed to git.
# Lower grades (added for the step-by-step ladder: grade 2 -> 4 -> 6 -> 8 -> 10 -> 12).
# Grade-2 'rasymas' is part 1 (language structure); part 2 (text writing) needs a judge.
